<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | RABIT</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Geist:wght@400&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #faf8ff;
        }
        .login-card {
            box-shadow: 0 8px 32px rgba(15, 23, 42, 0.04);
            border: 1px solid #e2e8f0;
        }
        .input-transition:focus {
            border-color: #12b19b;
            box-shadow: 0 0 0 2px rgba(18, 177, 155, 0.1);
        }
    </style>

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "inverse-primary": "#55dbc4",
                      "tertiary-fixed": "#abf0e3",
                      "on-secondary-fixed-variant": "#444749",
                      "inverse-surface": "#283044",
                      "surface-bright": "#faf8ff",
                      "on-tertiary-fixed": "#00201c",
                      "on-secondary-container": "#626567",
                      "error-container": "#ffdad6",
                      "surface-container-high": "#e2e7ff",
                      "outline-variant": "#bbcac5",
                      "surface-variant": "#dae2fd",
                      "background": "#faf8ff",
                      "surface": "#faf8ff",
                      "secondary": "#5c5f61",
                      "primary-fixed": "#75f8df",
                      "on-primary": "#ffffff",
                      "on-error": "#ffffff",
                      "secondary-fixed-dim": "#c4c7c9",
                      "on-primary-fixed": "#00201b",
                      "tertiary-fixed-dim": "#90d3c7",
                      "surface-container": "#eaedff",
                      "inverse-on-surface": "#eef0ff",
                      "on-background": "#131b2e",
                      "on-error-container": "#93000a",
                      "on-primary-fixed-variant": "#005045",
                      "tertiary-container": "#67aa9f",
                      "surface-tint": "#006b5d",
                      "on-tertiary-fixed-variant": "#005048",
                      "secondary-container": "#e0e3e5",
                      "primary-container": "#12b19b",
                      "on-tertiary": "#ffffff",
                      "on-surface": "#131b2e",
                      "outline": "#6c7a76",
                      "surface-dim": "#d2d9f4",
                      "secondary-fixed": "#e0e3e5",
                      "on-secondary-fixed": "#191c1e",
                      "primary": "#006b5d",
                      "primary-fixed-dim": "#55dbc4",
                      "on-primary-container": "#003d34",
                      "tertiary": "#226960",
                      "surface-container-highest": "#dae2fd",
                      "error": "#ba1a1a",
                      "surface-container-low": "#f2f3ff",
                      "surface-container-lowest": "#ffffff",
                      "on-tertiary-container": "#003d36",
                      "on-secondary": "#ffffff",
                      "on-surface-variant": "#3c4946"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "base": "8px",
                      "gutter": "24px",
                      "container-max": "1440px",
                      "margin-desktop": "40px",
                      "margin-mobile": "16px"
              },
              "fontFamily": {
                      "headline-lg-mobile": ["Plus Jakarta Sans"],
                      "body-md": ["Plus Jakarta Sans"],

<body class="bg-surface text-on-surface flex flex-col min-h-screen">
<main class="flex-grow flex items-center justify-center px-margin-mobile">
<div class="absolute inset-0 pointer-events-none opacity-20">
</div>
<section class="relative z-10 w-full max-w-[440px]">
<div class="login-card bg-surface-container-lowest rounded-xl p-8 md:p-10">
<div class="flex flex-col items-center mb-8">
<div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center mb-4 text-white">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">lan</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-secondary text-center">Login RABIT.</p>
</div>
<form class="space-y-6" onsubmit="handleLogin(event)">
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase" for="email">Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full h-12 bg-surface-container-low border border-outline-variant rounded-lg pl-10 pr-4 font-body-md text-body-md input-transition outline-none" id="email" placeholder="name@fiberflow.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant block uppercase" for="password">Password</label>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full h-12 bg-surface-container-low border border-outline-variant rounded-lg pl-10 pr-4 font-body-md text-body-md input-transition outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
</div>

<p id="error-message" class="text-error font-body-md text-[14px] hidden text-center">Email atau password salah. Silakan coba lagi.</p>

<div class="flex items-center gap-2">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary cursor-pointer" id="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-secondary select-none cursor-pointer" for="remember">Remember me for 30 days</label>
</div>
<button type="submit" class="w-full h-12 bg-primary-container text-on-primary-container font-headline-md text-[16px] font-semibold rounded-lg hover:brightness-95 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        Sign In
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="mt-8 pt-6 border-t border-outline-variant">
<div class="flex flex-col items-center gap-4">
</div>
</div>
</div>
</section>
</main>

<script>
        // Efek Fokus pada Input
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#006b5d';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#6c7a76';
            });
        });

        // ==========================================
        // LOGIKA LOGIN - GANTI EMAIL DAN PASSWORD DI SINI
        // ==========================================
        function handleLogin(event) {
            // Mencegah halaman refresh otomatis saat tombol ditekan
            event.preventDefault();

            // 1. TENTUKAN EMAIL & PASSWORD YANG BENAR DI SINI
            const emailBenar = "admin@rabit.com";
            const passwordBenar = "rabit123";

            // Mengambil data yang diketik oleh user
            const inputEmail = document.getElementById('email').value;
            const inputPassword = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');

            // Mengecek apakah input sesuai dengan data yang benar
            if (inputEmail === emailBenar && inputPassword === passwordBenar) {
                // Sembunyikan pesan error jika sebelumnya muncul
                errorMessage.classList.add('hidden');
                
                // Beri alert (opsional) lalu pindah halaman
                alert('Login Berhasil!');
                window.location.href = 'dashboard.html'; // Ganti '#dashboard' dengan link tujuan Anda, misal 'dashboard.html'
            } else {
                // Tampilkan pesan error jika salah
                errorMessage.classList.remove('hidden');
            }
        }
    </script>
</body></html>
