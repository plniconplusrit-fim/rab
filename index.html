<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Login - RABIT</title>
  
  <!-- Google Fonts: Inter & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..500,0..1,-50..200" rel="stylesheet"/>
  
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            crm: {
              active: '#1e4a42',
              activeHover: '#163b35',
              blue: '#00529b',
              textMuted: '#52606d',
              border: '#e2e8f0',
              bgCanvas: '#f8fafc',
              card: '#ffffff'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 350, 'GRAD' 0, 'opsz' 22;
      vertical-align: middle;
    }
  </style>
</head>
<body class="bg-crm-bgCanvas text-slate-800 antialiased flex items-center justify-center min-h-screen p-4 selection:bg-crm-active selection:text-white">

  <div class="w-full max-w-md bg-white rounded-2xl border border-crm-border p-8 md:p-10 shadow-sm">
    
    <!-- Brand Header -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-14 h-14 bg-emerald-50 rounded-2xl flex items-center justify-center mb-4 text-crm-active border border-emerald-100 shadow-xs">
        <span class="material-symbols-outlined text-[32px]">lan</span>
      </div>
      <div class="flex items-center text-2xl font-bold tracking-tight text-crm-blue">
        <span class="text-crm-active">RAB</span><span>IT</span>
        <span class="ml-1 inline-flex text-xs font-black"><span class="text-rose-600">+</span></span>
      </div>
      <p class="text-xs text-crm-textMuted mt-1">RAB AKTIVASI & INSTALASI</p>
    </div>

    <!-- Form Login -->
    <form class="space-y-4" onsubmit="handleLogin(event)">
      
      <!-- Username Input -->
      <div>
        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5" for="username">Username</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">person</span>
          <input 
            type="text" 
            id="username" 
            required
            placeholder="Masukkan username Anda"
            class="w-full h-11 bg-slate-50 border border-slate-200 rounded-lg pl-10 pr-4 text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:ring-1 focus:ring-crm-active focus:border-crm-active transition-all"
          />
        </div>
      </div>

      <!-- Password Input -->
      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider" for="password">Password</label>
        </div>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-[20px]">lock</span>
          <input 
            type="password" 
            id="password" 
            required
            placeholder="••••••••" 
            class="w-full h-11 bg-slate-50 border border-slate-200 rounded-lg pl-10 pr-4 text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:ring-1 focus:ring-crm-active focus:border-crm-active transition-all"
          />
        </div>
      </div>

      <!-- Pesan Error -->
      <div id="error-message" class="hidden p-3 bg-rose-50 border border-rose-200 text-rose-600 text-xs rounded-lg font-medium text-center">
        Username atau password salah. Silakan coba lagi.
      </div>

      <!-- Tombol Sign In -->
      <button 
        type="submit" 
        class="w-full h-11 bg-crm-active hover:bg-crm-activeHover text-white text-sm font-semibold rounded-lg shadow-sm active:scale-[0.99] transition-all flex items-center justify-center gap-2 mt-2">
        <span>Masuk ke Sistem</span>
        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
      </button>

    </form>

    <!-- Footer Note -->
    <div class="mt-8 pt-5 border-t border-slate-100 text-center">
      <p class="text-[11px] text-slate-400">RABIT &copy; 2026</p>
    </div>

  </div>

  <script>
    // =========================================================================
    // DATABASE USER & PERMISSION ACCESS
    // =========================================================================
    const USERS_DB = [
      {
        username: "iconplusmks",
        password: "12345",
        name: "Icon Plus Makassar",
        role: "smart_rab_only", // Khusus hanya bisa akses Smart RAB
        redirectTo: "smart-rab.html"
      },
      {
        username: "admin@rabit.com",
        password: "rabit123",
        name: "Admin Pusat",
        role: "admin", // Full akses semua menu
        redirectTo: "dashboard.html"
      },
      {
        username: "admin",
        password: "admin",
        name: "Administrator",
        role: "admin",
        redirectTo: "dashboard.html"
      }
    ];

    function handleLogin(event) {
      event.preventDefault();

      const inputUser = document.getElementById('username').value.trim();
      const inputPass = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('error-message');

      // Validasi pencocokan user
      const userFound = USERS_DB.find(u => 
        u.username.toLowerCase() === inputUser.toLowerCase() && u.password === inputPass
      );

      if (userFound) {
        errorMsg.classList.add('hidden');
        
        // Simpan sesi autentikasi ke localStorage
        // Dibungkus try/catch: pada sebagian browser yang membuka file via
        // file:// atau mode private ketat, localStorage bisa melempar error.
        // Login tetap dilanjutkan meski penyimpanan sesi gagal.
        try {
          localStorage.setItem('rabit_auth', JSON.stringify({
            username: userFound.username,
            name: userFound.name,
            role: userFound.role,
            loginAt: new Date().toISOString()
          }));
        } catch (e) {
          console.warn('[RABIT] Gagal menyimpan sesi:', e);
        }

        // Arahkan ke halaman sesuai izin aksesnya
        window.location.href = userFound.redirectTo;
      } else {
        errorMsg.classList.remove('hidden');
      }
    }
  </script>

</body>
</html>
